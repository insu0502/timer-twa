name: Build TWA APK/AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: JDK 17 + Android SDK 설치
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708

      - name: JDK 17 설치
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Bubblewrap 설치
        run: |
          npm install -g @bubblewrap/cli

      - name: 파일 정리 + config.json 생성
        run: |
          mkdir -p www
          cp icon-512.png www/icon-512.png 2>/dev/null || true
          cp index.html www/index.html 2>/dev/null || true
          cp manifest.json www/manifest.json 2>/dev/null || true
          cd www
          echo "=== manifest.json ==="
          cat manifest.json
          # Bubblewrap 설정 파일 생성 (비대화형 빌드용)
          cat > config.json << CFGEOF
          {
            "jdkPath": "${JAVA_HOME}",
            "androidSdkPath": "${ANDROID_HOME}"
          }
          CFGEOF
          echo "=== config.json ==="
          cat config.json

      - name: Bubblewrap 초기화 및 빌드
        run: |
          cd www
          # manifest.json을 GitHub Pages URL로 전달
          bubblewrap init --config config.json --manifest https://insu0502.github.io/timer-twa/manifest.json
          # 빌드 실행
          bubblewrap build --config config.json --generate-apk --generate-aab --skip/sdk-version-check

      - name: 결과물 업로드 (아티팩트)
        uses: actions/upload-artifact@v4
        with:
          name: twa-build-output
          path: |
            build/outputs/apk/debug/*.apk
            build/outputs/bundle/debug/*.aab
          retention-days: 5
