name: Build TWA APK/AAB

on:
  workflow_dispatch:
    inputs:
      manifest_json:
        description: 'manifest.json 전체 내용 (raw JSON)'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: JDK 17 + Android SDK 설치
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708

      - name: JDK 17 설치
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Bubblewrap 설치
        run: |
          npm install -g @bubblewrap/cli

      - name: Bubblewrap 초기화 및 빌드
        run: |
          cd www
          # 이미 config.json이 있는지 확인, 없으면 생성
          if [ ! -f config.json ]; then
            cat > config.json << EOF
            {
              "jdkPath": "${JAVA_HOME}",
              "androidSdkPath": "${ANDROID_HOME}"
            }
            EOF
          fi
          echo "=== config.json ==="
          cat config.json
          # Bubblewrap 초기화 (twa-manifest.json 생성)
          bubblewrap init --config config.json --manifest manifest.json
          # 빌드 실행
          bubblewrap build --config config.json --generate-apk --generate-aab --skip/sdk-version-check



      - name: 결과물 업로드 (아티팩트)
        uses: actions/upload-artifact@v4
        with:
          name: twa-build-output
          path: |
            build/outputs/apk/debug/*.apk
            build/outputs/bundle/debug/*.aab
          retention-days: 5
