name: Build TWA APK/AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: JDK 17 + Android SDK 설치
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708

      - name: JDK 17 설치
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Bubblewrap 설치
        run: |
          npm install -g @bubblewrap/cli

      - name: Keystore 디코딩 (GitHub Secrets → 파일)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > www/release-keystore.jks
          echo "✅ Keystore 복원 완료: $(stat -c%s www/release-keystore.jks 2>/dev/null || stat -f%z www/release-keystore.jks) bytes"
          ls -la www/release-keystore.jks

      - name: config.json 생성 + 빌드
        run: |
          cd www
          # Bubblewrap 설정 파일 생성 (비대화형 빌드용) — init은 필요 없음
          cat > config.json << CFGEOF
          {
            "jdkPath": "${JAVA_HOME}",
            "androidSdkPath": "${ANDROID_HOME}"
          }
          CFGEOF
          echo "=== config.json ==="
          cat config.json
          echo ""
          echo "=== twa-manifest.json (이미 www/에 있음) ==="
          cat twa-manifest.json
          echo ""
          echo "=== 빌드 시작 ==="
          # bubblewrap update로 checksum 생성 후 build (또는 "no" 자동 응답)
          # twa-manifest.json이 이미 있으므로 update 건너뛰고 build
          echo "no" | bubblewrap build \
            --config config.json \
            --generate-apk \
            --generate-aab \
            --skip/sdk-version-check

      - name: 결과물 업로드 (아티팩트)
        uses: actions/upload-artifact@v4
        with:
          name: twa-build-output
          path: |
            build/outputs/apk/debug/*.apk
            build/outputs/bundle/debug/*.aab
          retention-days: 5
